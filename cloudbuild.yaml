steps:
- name: 'node'
  entrypoint: 'npm'
  args: ['install']
- name: 'node'
  entrypoint: 'npm'
  args: ['run','build']
- name: "gcr.io/cloud-builders/gcloud"
  entrypoint: bash
  args:
    - "-c"
    - |
        rm -r node_modules
        gcloud app deploy
timeout: "420s"
options:
  logging: CLOUD_LOGGING_ONLY